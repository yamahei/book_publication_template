<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ショート動画レコーダー | 書籍出版テンプレート</title>
  <meta name="description" content="書籍の宣伝用ショート動画を、ブラウザ上で再生・録画・ダウンロードするツール">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700&display=block">
  <link rel="stylesheet" href="recorder.css">
</head>
<body>
  <main class="layout">
    <!-- 録画対象の枠（この要素の範囲だけを切り取って録画する） -->
    <div id="stage-frame" class="stage-frame">
      <div id="stage" class="stage">
        <!-- 背景（Canvasによるプリセット背景 / 動画背景） -->
        <canvas id="bg-canvas" class="stage-bg-canvas" width="1080" height="1920"></canvas>
        <video id="bg-video" class="stage-bg is-hidden" muted loop playsinline preload="auto"></video>
        <div id="stage-shade" class="stage-shade"></div>
        <div id="phase4-overlay" class="phase4-overlay"></div>

        <!-- 起・承・転：縦書きテキスト表示領域 -->
        <div id="phase-text-area" class="phase-text-area" data-phase="起">
          <div id="stage-text" class="stage-text"></div>
        </div>

        <!-- フェーズ4：誘導（表紙画像＋書籍タイトル＋CTA） -->
        <div id="phase-ending" class="phase-ending" aria-hidden="true">
          <div id="ending-cover-wrap" class="ending-cover-wrap">
            <img id="ending-cover" class="ending-cover" alt="書籍表紙">
          </div>
          <div class="ending-text-group">
            <p id="ending-subtitle" class="ending-subtitle"></p>
            <p id="ending-title" class="ending-title"></p>
            <p id="ending-cta" class="ending-cta"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- 操作パネル（録画範囲の外） -->
    <aside class="panel">
      <h1 class="panel-title">ショート動画レコーダー</h1>
      <ol id="movie-list" class="movie-list"></ol>
      <p id="status" class="status" role="status"></p>
    </aside>
  </main>

  <script src="movies.js"></script>
  <script src="recorder.js?v=6"></script>
</body>
</html>
